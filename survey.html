<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encuesta La Ruedita Club</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px}
    .card{background:white;border-radius:12px;max-width:400px;margin:0 auto;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
    h2{margin:0 0 8px;text-align:center;color:#333}
    p{margin:8px 0 20px;color:#666;text-align:center;font-size:14px}
    .stars{display:flex;justify-content:center;gap:8px;margin-bottom:24px}
    .star{font-size:2rem;cursor:pointer;color:#ddd}
    .star.selected,.star.hovered{color:#ffc107!important}
    textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;resize:vertical;font-family:inherit;font-size:14px}
    .btn{width:100%;padding:12px;background:#007bff;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer}
    .btn:hover:not(:disabled){background:#0056b3}
    .btn:disabled{background:#6c757d;cursor:not-allowed}
    .alert{padding:12px 16px;border-radius:6px;margin-top:16px;font-size:14px}
    .success{background:#d1e7dd;color:#0f5132}
    .danger{background:#f8d7da;color:#842029}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>¿Cómo fue tu experiencia?</h2>
    <p>La Ruedita Club agradece tu opinión</p>
    <form id="f">
      <input type="hidden" id="t" name="token">
      <input type="hidden" id="r" name="rating" required>
      <div class="stars">
        <span class="star" data-v="1">&#9733;</span>
        <span class="star" data-v="2">&#9733;</span>
        <span class="star" data-v="3">&#9733;</span>
        <span class="star" data-v="4">&#9733;</span>
        <span class="star" data-v="5">&#9733;</span>
      </div>
      <label>Comentario:</label>
      <textarea id="c" name="comment" placeholder="Opcional"></textarea>
      <button type="submit" class="btn" id="b" disabled>Enviar</button>
      <div id="s" class="alert success hidden"></div>
      <div id="e" class="alert danger hidden"></div>
    </form>
  </div>
  <script>
    var url=new URLSearchParams(location.search);
    if(url.has('t'))document.getElementById('t').value=url.get('t');
    var stars=document.querySelectorAll('.star'),rating=document.getElementById('r'),btn=document.getElementById('b');
    function set(n){
      stars.forEach(function(s,i){s.classList.toggle('selected',i<n)});
    }
    stars.forEach(function(s){
      s.onclick=function(){
        var v=parseInt(s.getAttribute('data-v'));
        rating.value=v;set(v);
        btn.disabled=!1;
      };
      s.onmouseover=function(){var v=parseInt(s.getAttribute('data-v'));set(v);};
      s.onmouseleave=function(){set(parseInt(rating.value)||0);};
    });
    document.getElementById('f').onsubmit=function(e){
      e.preventDefault();
      btn.disabled=true;btn.textContent='Enviando...';
      document.getElementById('s').classList.add('hidden');
      document.getElementById('e').classList.add('hidden');
      fetch('/api/fid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit_survey',token:document.getElementById('t').value,rating:parseInt(rating.value),comment:document.getElementById('c').value.trim()})})
        .then(function(r){return r.json().then(function(d){return {o:r.ok,d:d})})})
        .then(function(r){
          if(r.o){document.getElementById('s').classList.remove('hidden');document.getElementById('s').textContent=r.d.message||'Gracias';document.getElementById('f').innerHTML='';}
          else{document.getElementById('e').classList.remove('hidden');document.getElementById('e').textContent=r.d.message||'Error';}
        })
        .catch(function(){document.getElementById('e').classList.remove('hidden');document.getElementById('e').textContent='Error de conexión';})
        .finally(function(){btn.disabled=!1;btn.textContent='Enviar';});
    };
  </script>
</body>
</html>
