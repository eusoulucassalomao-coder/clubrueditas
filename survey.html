<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encuesta La Ruedita Club</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    .star-rating { font-size: 2rem; cursor: pointer; color: #ddd; transition: color 0.2s; }
    .star-rating.selected, .star-rating.hovered { color: #ffc107 !important; }
  </style>
</head>
<body class="bg-light" data-bs-theme="light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">¿Cómo fue tu experiencia?</h3>
            <p class="text-center text-muted mb-4">La Ruedita Club te agradecida tu opinión</p>

            <form id="surveyForm">
              <input type="hidden" id="token" name="token">
              <input type="hidden" id="rating" name="rating" required>

              <div class="mb-4 text-center">
                <span class="star-rating" data-value="1">&#9733;</span>
                <span class="star-rating" data-value="2">&#9733;</span>
                <span class="star-rating" data-value="3">&#9733;</span>
                <span class="star-rating" data-value="4">&#9733;</span>
                <span class="star-rating" data-value="5">&#9733;</span>
              </div>

              <div class="mb-4">
                <textarea class="form-control" id="comment" name="comment" rows="3"
                  placeholder="Comentario opcional (puedes contarnos qué mejoraríamos...)"
                  maxlength="500"></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100" id="submitBtn" disabled>
                Enviar encuesta
              </button>

              <div id="result" class="alert alert-success d-none mt-3" role="alert"></div>
              <div id="error" class="alert alert-danger d-none mt-3" role="alert"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('t');
    if (token) {
      document.getElementById('token').value = token;
    }

    const stars = document.querySelectorAll('.star-rating');
    const ratingInput = document.getElementById('rating');

    function setStars(rating) {
      stars.forEach((star, i) => {
        star.classList.toggle('selected', i < rating);
      });
    }

    stars.forEach(star => {
      star.addEventListener('click', () => {
        const value = parseInt(star.dataset.value);
        ratingInput.value = value;
        stars.forEach(s => s.classList.remove('hovered'));
        setStars(value);
        document.getElementById('submitBtn').disabled = false;
      });

      star.addEventListener('mouseenter', () => {
        const value = parseInt(star.dataset.value);
        stars.forEach((s, i) => {
          s.classList.toggle('hovered', i < value);
        });
      });

      star.addEventListener('mouseleave', () => {
        stars.forEach(s => s.classList.remove('hovered'));
        setStars(parseInt(ratingInput.value) || 0);
      });
    });

    document.getElementById('surveyForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const result = document.getElementById('result');
      const error = document.getElementById('error');
      const rating = document.getElementById('rating').value;
      const comment = document.getElementById('comment').value.trim();

      btn.disabled = true;
      btn.textContent = 'Enviando...';
      result.classList.add('d-none');
      error.classList.add('d-none');

      try {
        const res = await fetch('/api/fid', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            action: 'submit_survey',
            token,
            rating: parseInt(rating),
            comment
          })
        });
        const data = await res.json();

        if (res.ok) {
          result.classList.remove('d-none');
          result.textContent = data.message || '¡Gracias por tu opinión!';
          document.getElementById('surveyForm').innerHTML = '';
        } else {
          error.classList.remove('d-none');
          error.textContent = data.message || 'Error al enviar. Intenta de nuevo.';
        }
      } catch (e) {
        error.classList.remove('d-none');
        error.textContent = 'Error de conexión. Intenta de nuevo.';
      }
      btn.disabled = false;
      btn.textContent = 'Enviar encuesta';
    });
  </script>
</body>
</html>
