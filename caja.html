<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Caja · Club</title>
<link rel="icon" href="assets/logo.webp">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="gate" id="gate">
  <form class="card" id="pinForm">
    <h2>Caja</h2><p class="sub">Ingresá el PIN del local</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
    <p class="msg err" id="pinMsg" role="alert"></p>
    <button class="btn full" type="submit">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="top-in"><img id="logo" alt=""><h1>Caja<small id="club"></small></h1><button id="out" type="button">Salir</button></div></header>
  <main class="wrap" style="max-width:640px">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="visita" role="tab">Registrar visita</button>
      <button class="tab" data-tab="canje" role="tab">Entregar premio</button>
      <button class="tab" data-tab="nuevo" role="tab">Cliente nuevo</button>
    </div>

    <section id="p-visita" class="card">
      <h2>Registrar visita</h2><p class="sub">Buscá al cliente por WhatsApp, nombre o código.</p>
      <input id="q" type="search" autocomplete="off" placeholder="WhatsApp, nombre o código" aria-label="Buscar cliente">
      <div class="res" id="res"></div>
      <div id="sel" hidden>
        <div class="cust" id="custBox"></div>
        <label for="amount">Valor de la cuenta ($)</label>
        <input id="amount" type="tel" inputmode="numeric" placeholder="Ej.: 28500" autocomplete="off">
        <div class="prev" id="prev" hidden></div>
        <p class="msg" id="vMsg" role="status"></p>
        <button class="btn full" id="doVisit" type="button">Registrar visita</button>
        <div class="row2" style="margin-top:10px"><button class="btn ghost sm" id="bBirth" type="button"></button><button class="btn ghost sm" id="bReview" type="button"></button></div>
      </div>
    </section>

    <section id="p-canje" class="card" hidden>
      <h2>Entregar premio</h2><p class="sub">Pedile al cliente el código que ve en “Mis puntos”.</p>
      <input id="code" autocomplete="off" placeholder="Código (ej.: P48213)" autocapitalize="characters" aria-label="Código de premio">
      <p class="msg" id="cMsg" role="status"></p>
      <div id="cBox"></div>
      <button class="btn full" id="doCode" type="button">Buscar código</button>
    </section>

    <section id="p-nuevo" class="card" hidden>
      <h2>Cliente nuevo</h2><p class="sub">Alta rápida en el local.</p>
      <form id="newForm" novalidate>
        <label>Nombre<input name="name" autocomplete="off" required></label>
        <label>WhatsApp<input name="phone" type="tel" inputmode="tel" autocomplete="off" required></label>
        <label>Cumpleaños (opcional)<input name="birthday" type="date"></label>
        <label style="display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--muted)"><input type="checkbox" name="consent" style="width:20px;height:20px;margin-top:2px"><span>El cliente aceptó recibir mensajes por WhatsApp.</span></label>
        <p class="msg" id="nMsg" role="alert"></p>
        <button class="btn full" type="submit">Dar de alta</button>
      </form>
    </section>

    <section class="card"><h2>Últimas visitas</h2><ul class="list" id="recent"></ul></section>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/caja.js"></script>
</body>
</html>
