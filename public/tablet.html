<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#102016">
<title>Tablet · Club La Ruedita</title>
<link rel="icon" href="assets/logo.webp">
<link rel="stylesheet" href="css/admin.css">
<style>
  html,body{height:100%}
  body{background:radial-gradient(1200px 700px at 50% -10%,#1f3a27,#0b170f);color:var(--cream);overflow:hidden;user-select:none;-webkit-user-select:none}
  .stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:20px;text-align:center}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:52px;height:52px;border-radius:50%}
  .brand b{font-family:var(--serif);font-weight:400;font-size:clamp(22px,3.4vw,34px);color:#f4e3b0;letter-spacing:.02em}
  .lead{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(24px,4.4vw,46px);line-height:1.15;color:#fff}
  .lead em{font-style:normal;color:var(--gold2)}
  .qrbox{background:#fff;border-radius:28px;padding:clamp(14px,2.4vw,26px);box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 6px rgba(233,196,106,.35);width:min(62vh,78vw);aspect-ratio:1}
  .qrbox svg{display:block;width:100%;height:100%}
  .bar{width:min(62vh,78vw);height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c9a227,#f0d27f);transform-origin:left center}
  .hint{margin:0;font-size:clamp(14px,1.9vw,20px);opacity:.8}
  .steps{display:flex;gap:clamp(10px,2vw,28px);flex-wrap:wrap;justify-content:center;font-size:clamp(13px,1.7vw,18px)}
  .steps span{padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(233,196,106,.25)}
  .off{position:fixed;top:10px;right:12px;opacity:.25;font-size:12px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:5px 12px;cursor:pointer}
  .off:hover{opacity:.9}
  .warn{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#7a2b2b;color:#fff;padding:8px 16px;border-radius:99px;font-size:14px}
  .gate .card{color:var(--text)}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="card" id="loginForm">
    <h2>Tablet</h2><p class="sub">Ingresá con la cuenta de la caja para activar el QR</p>
    <label for="tEmail">E-mail</label>
    <input id="tEmail" type="email" autocomplete="username" aria-label="E-mail">
    <label for="tPass">Contraseña</label>
    <input id="tPass" type="password" autocomplete="current-password" aria-label="Contraseña">
    <p class="msg err" id="loginMsg" role="alert"></p>
    <button class="btn full" type="submit">Activar</button>
  </form>
</div>

<main class="stage" id="stage" hidden>
  <div class="brand"><img src="assets/logo.webp" alt=""><b>Club La Ruedita</b></div>
  <h1 class="lead">Escaneá y <em>sumá puntos</em><br>o canjeá tu premio</h1>
  <div class="qrbox" id="qr" role="img" aria-label="Código QR para registrar tu visita o canjear tu premio"></div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="steps"><span>1 · Escaneá el QR</span><span>2 · Elegí visita o premio</span><span>3 · Confirmá con el código de WhatsApp</span></div>
  <p class="hint">El QR cambia solo cada pocos segundos, por seguridad.</p>
  <button class="off" id="off" type="button">Salir</button>
  <div class="warn" id="warn" hidden>Sin conexión… reintentando</div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/tablet.js"></script>
</body>
</html>
